[project]
name = "dependent-rollouts"
version = "0.1.0"
description = "Dependent-rollout contrast geometry: ICLR 2027 experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.3.2",
]

[project.scripts]
dependent-rollouts = "dependent_rollouts.cli:main"

[project.optional-dependencies]
llm = [
    "safetensors==0.8.0",
    "torch==2.8.0",
    "transformers==5.15.1",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/test_llm.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
