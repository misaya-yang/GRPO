[project]
name = "dependent-rollouts"
version = "0.1.0"
description = "Feedback coupling and standardized credit: theory and experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.3.2",
]

[project.scripts]
dependent-rollouts = "dependent_rollouts.cli:main"
reward-coupling = "reward_coupling.cli:main"
stratified-grpo = "stratified_grpo.cli:main"

[project.optional-dependencies]
llm = [
    "safetensors==0.8.0",
    "torch==2.8.0",
    "transformers==5.15.1",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["dependent_rollouts", "reward_coupling", "stratified_grpo"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["scripts/archive", "docs/theory/v5_1_original", "reports/v5_1_prepare/oracle"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/test_llm.py" = ["E402"]
"tests/test_feedback_llm.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
